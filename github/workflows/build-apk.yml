name: Build KREASI AI STUDIO APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Locate Android project (root folder or ZIP)
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            project_dir="$GITHUB_WORKSPACE"
            echo "Android project found in repository root."
          else
            zip_file="$GITHUB_WORKSPACE/KREASI_AI_STUDIO_v1.zip"

            if [[ ! -f "$zip_file" ]]; then
              zip_file="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit || true)"
            fi

            if [[ -z "$zip_file" || ! -f "$zip_file" ]]; then
              echo "ERROR: No Android project found. Upload the project files or KREASI_AI_STUDIO_v1.zip to the repository root."
              exit 1
            fi

            extract_dir="$GITHUB_WORKSPACE/_build_source"
            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            unzip -q "$zip_file" -d "$extract_dir"

            settings_file="$(find "$extract_dir" -type f -name 'settings.gradle.kts' -print -quit || true)"
            if [[ -z "$settings_file" ]]; then
              echo "ERROR: settings.gradle.kts was not found inside the ZIP file."
              exit 1
            fi

            project_dir="${settings_file%/settings.gradle.kts}"
            if [[ ! -f "$project_dir/app/build.gradle.kts" ]]; then
              echo "ERROR: app/build.gradle.kts was not found next to settings.gradle.kts."
              exit 1
            fi
            echo "Android project extracted from: $(basename "$zip_file")"
          fi

          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Project directory: $project_dir"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Check toolchain versions
        run: |
          java -version
          gradle --version
          sdkmanager --list | grep -E 'platforms;android-35|build-tools;35.0.0' || true

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK output
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk" ]]; then
            echo "ERROR: APK file was not generated: $apk"
            exit 1
          fi
          echo "APK generated successfully: $apk"
          ls -lh "$apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: KREASI-AI-STUDIO-v1-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
